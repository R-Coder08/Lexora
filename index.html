<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexora — Visual Vocabulary & Grammar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #e0e5ec;
      --light-shadow: #ffffff;
      --dark-shadow: #a3b1c6;
      --primary: #4d7cfe;
      --primary-glow: rgba(77, 124, 254, 0.35);
      --text-main: #2d3748;
      --text-muted: #718096;
      --danger: #e63946;
      --success: #2ec4b6;
      --card-radius: 20px;
      --pill-radius: 50px;
      --elevated-shadow: 8px 8px 18px var(--dark-shadow), -8px -8px 18px var(--light-shadow);
      --elevated-sm: 4px 4px 10px var(--dark-shadow), -4px -4px 10px var(--light-shadow);
      --inset-shadow: inset 5px 5px 10px var(--dark-shadow), inset -5px -5px 10px var(--light-shadow);
      --inset-sm: inset 3px 3px 6px var(--dark-shadow), inset -3px -3px 6px var(--light-shadow);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .splash-badge {
      width: 110px;
      height: 110px;
      border-radius: 30px;
      background: var(--bg);
      box-shadow: var(--elevated-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulseBrand 1.5s infinite ease-in-out;
      margin-bottom: 24px;
    }

    .splash-badge svg {
      width: 54px;
      height: 54px;
      fill: var(--primary);
      filter: drop-shadow(0 2px 8px var(--primary-glow));
    }

    .splash-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .splash-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
      font-weight: 500;
    }

    @keyframes pulseBrand {
      0%, 100% { transform: scale(1); box-shadow: var(--elevated-shadow); }
      50% { transform: scale(1.04); box-shadow: 12px 12px 24px var(--dark-shadow), -12px -12px 24px var(--light-shadow); }
    }

    /* Top Nav */
    header {
      width: 100%;
      max-width: 900px;
      padding: 24px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--bg);
      box-shadow: var(--elevated-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 24px;
      height: 24px;
      fill: var(--primary);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .neo-btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: none;
      background: var(--bg);
      box-shadow: var(--elevated-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .neo-btn-icon:active {
      box-shadow: var(--inset-sm);
      transform: scale(0.96);
    }

    .lang-indicator {
      font-weight: 700;
      font-size: 13px;
      color: var(--primary);
      text-transform: uppercase;
      margin-left: 2px;
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 900px;
      padding: 16px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Hub Switcher Cards */
    .hub-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .hub-card {
      background: var(--bg);
      border-radius: var(--card-radius);
      box-shadow: var(--elevated-shadow);
      padding: 20px 18px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.25s ease;
      text-align: left;
    }

    .hub-card.active {
      box-shadow: var(--inset-shadow);
      border-color: rgba(77, 124, 254, 0.3);
    }

    .hub-card-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .hub-card-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .hub-card-sub {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Search & Filters Section */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-bar-neo {
      width: 100%;
      height: 52px;
      border-radius: var(--pill-radius);
      background: var(--bg);
      box-shadow: var(--inset-shadow);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
    }

    .search-bar-neo svg {
      width: 20px;
      height: 20px;
      fill: var(--text-muted);
      flex-shrink: 0;
    }

    .search-bar-neo input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .search-bar-neo input::placeholder {
      color: #9aa8ba;
      font-weight: 500;
    }

    /* A-Z Multi-select Bar */
    .alphabet-scroll-container {
      width: 100%;
      overflow-x: auto;
      padding: 6px 2px 14px;
      scrollbar-width: none;
    }
    .alphabet-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .alphabet-pills-row {
      display: flex;
      gap: 8px;
      width: max-content;
    }

    .alpha-pill {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: none;
      background: var(--bg);
      box-shadow: var(--elevated-sm);
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      user-select: none;
    }

    .alpha-pill.active {
      box-shadow: var(--inset-sm);
      color: var(--primary);
      font-weight: 800;
      background: #d8deeb;
    }

    /* Parts of Speech Pill Selector */
    .pos-scroll-container {
      width: 100%;
      overflow-x: auto;
      padding: 4px 2px 12px;
      scrollbar-width: none;
    }
    .pos-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .pos-pills-row {
      display: flex;
      gap: 10px;
      width: max-content;
    }

    .pos-pill {
      padding: 10px 18px;
      border-radius: var(--pill-radius);
      border: none;
      background: var(--bg);
      box-shadow: var(--elevated-sm);
      font-weight: 700;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-transform: capitalize;
    }

    .pos-pill.active {
      box-shadow: var(--inset-sm);
      color: var(--primary);
      background: #d8deeb;
    }

    /* Active Filter indicator ribbon */
    .active-filters-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .clear-filter-btn {
      color: var(--primary);
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 700;
    }

    /* Vocabulary Cards Feed */
    .vocab-feed-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .vocab-card {
      background: var(--bg);
      border-radius: var(--card-radius);
      box-shadow: var(--elevated-shadow);
      padding: 22px;
      position: relative;
      transition: transform 0.2s ease;
    }

    .vocab-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .vocab-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .vocab-word {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .vocab-pos-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--bg);
      box-shadow: var(--inset-sm);
      color: var(--primary);
    }

    .speaker-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--bg);
      box-shadow: var(--elevated-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--primary);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .speaker-btn:active, .speaker-btn.speaking {
      box-shadow: var(--inset-sm);
      transform: scale(0.92);
      color: #3158c9;
    }

    .speaker-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .vocab-meaning-box {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.35);
      border-left: 3px solid var(--primary);
    }

    .vocab-meaning-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .vocab-meaning-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      font-family: 'Noto Sans Devanagari', 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
    }

    .vocab-example-box {
      font-size: 14px;
      color: #4a5568;
      font-style: italic;
      line-height: 1.5;
    }

    .vocab-example-box strong {
      font-weight: 700;
      font-style: normal;
      color: var(--text-muted);
      margin-right: 4px;
    }

    /* Load More & Exhaust Banner */
    .feed-footer-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }

    .neo-action-btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--pill-radius);
      border: none;
      background: var(--bg);
      box-shadow: var(--elevated-shadow);
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .neo-action-btn:active {
      box-shadow: var(--inset-shadow);
      transform: scale(0.98);
    }

    .exhaust-banner {
      width: 100%;
      padding: 18px;
      border-radius: var(--card-radius);
      background: var(--bg);
      box-shadow: var(--inset-shadow);
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .empty-state-box {
      width: 100%;
      padding: 40px 20px;
      border-radius: var(--card-radius);
      background: var(--bg);
      box-shadow: var(--inset-shadow);
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-state-box svg {
      width: 48px;
      height: 48px;
      fill: var(--dark-shadow);
    }

    /* Language Modal */
    .neo-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(163, 177, 198, 0.45);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    .neo-modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .neo-modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg);
      border-radius: 24px;
      box-shadow: 16px 16px 32px var(--dark-shadow), -16px -16px 32px var(--light-shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transform: scale(0.92);
      transition: transform 0.25s ease;
    }

    .neo-modal-overlay.open .neo-modal-card {
      transform: scale(1);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-head h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }

    .lang-options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lang-select-pill {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      background: var(--bg);
      box-shadow: var(--elevated-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .lang-select-pill.selected {
      box-shadow: var(--inset-sm);
      color: var(--primary);
      background: #d8deeb;
    }

    .coming-soon-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--bg);
      box-shadow: var(--inset-sm);
      color: var(--text-muted);
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .hub-grid {
        grid-template-columns: 1fr;
      }
      .vocab-word {
        font-size: 19px;
      }
      header {
        padding: 16px 16px 6px;
      }
      main {
        padding: 12px 16px 50px;
      }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="splash-title">Lexora</div>
    <div class="splash-sub">Visual Vocabulary &amp; Grammar Hub</div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand-logo" onclick="window.scrollTo({top:0, behavior:'smooth'})">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-name">Lexora</div>
    </div>
    <div class="nav-actions">
      <button class="neo-btn-icon" id="settings-toggle-btn" title="Language Localization">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main View -->
  <main>
    <!-- Hub Switchers -->
    <section class="hub-grid">
      <div class="hub-card active" id="hub-vocab-tab" onclick="switchHubMode('vocab')">
        <div class="hub-card-tag">Module 01</div>
        <div class="hub-card-title">Vocabulary Lists</div>
        <div class="hub-card-sub">A to Z words with bilingual meanings &amp; audio</div>
      </div>
      <div class="hub-card" id="hub-pos-tab" onclick="switchHubMode('pos')">
        <div class="hub-card-tag">Module 02</div>
        <div class="hub-card-title">Parts of Speech</div>
        <div class="hub-card-sub">Nouns, Verbs, Adjectives, Adverbs &amp; more</div>
      </div>
    </section>

    <!-- Filters Section -->
    <section class="controls-wrapper">
      <!-- Live Search Bar -->
      <div class="search-bar-neo">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="lexora-search-input" placeholder="Search vocabulary or meaning..." autocomplete="off" />
      </div>

      <!-- A-Z Alphabet Multi-Selector (Vocab Mode) -->
      <div id="vocab-filter-section">
        <div class="alphabet-scroll-container">
          <div class="alphabet-pills-row" id="alpha-pills-container">
            <!-- Rendered dynamically (A-Z) -->
          </div>
        </div>
      </div>

      <!-- Parts of Speech Selector (POS Mode) -->
      <div id="pos-filter-section" style="display: none;">
        <div class="pos-scroll-container">
          <div class="pos-pills-row" id="pos-pills-container">
            <!-- 8 Parts of speech rendered here -->
          </div>
        </div>
      </div>

      <!-- Filter status indicator -->
      <div class="active-filters-info" id="filter-status-ribbon">
        <span id="filter-count-label">Showing all records</span>
        <button class="clear-filter-btn" id="clear-all-filters-btn" style="display: none;" onclick="resetAllFilters()">Reset Filters</button>
      </div>
    </section>

    <!-- Feed Container -->
    <section class="vocab-feed-grid" id="vocab-cards-feed">
      <!-- Words injected here -->
    </section>

    <!-- Footer Action / Exhaust Banner -->
    <div class="feed-footer-actions">
      <button class="neo-action-btn" id="load-more-btn" onclick="loadMoreBatch()">
        <span>Load More Words</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="exhaust-banner" id="exhaust-state-banner" style="display: none;">
        ✨ More Vocabularies are coming.
      </div>
    </div>
  </main>

  <!-- Language Settings Modal -->
  <div class="neo-modal-overlay" id="lang-modal">
    <div class="neo-modal-card">
      <div class="modal-head">
        <h3>Language Localization</h3>
        <button class="neo-btn-icon" onclick="closeLangModal()">✕</button>
      </div>
      <div class="lang-options-grid">
        <button class="lang-select-pill" id="lang-btn-hi" onclick="setLanguage('hi')">
          <span>Hindi (हिन्दी)</span>
          <span class="active-tick">✓</span>
        </button>
        <button class="lang-select-pill" id="lang-btn-bn" onclick="setLanguage('bn')">
          <span>Bangla (বাংলা)</span>
          <span class="active-tick">✓</span>
        </button>
      </div>
      <div style="text-align: center; margin-top: 4px;">
        <span class="coming-soon-badge">More regional languages coming soon</span>
      </div>
    </div>
  </div>

  <!-- Firebase CDN SDKs & Core Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDr9WJjxT2ukf9-rVqDbwPSyyS5ePQeiGc",
      authDomain: "lexora-web.firebaseapp.com",
      databaseURL: "https://lexora-web-default-rtdb.firebaseio.com",
      projectId: "lexora-web",
      storageBucket: "lexora-web.firebasestorage.app",
      messagingSenderId: "1024514893435",
      appId: "1:1024514893435:web:7f60901be0e63ce4cb24de"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Global App State
    window.AppState = {
      rawVocabularies: [],
      filteredDataset: [],
      currentBatchIndex: 0,
      batchSize: 20,
      activeMode: 'vocab', // 'vocab' | 'pos'
      selectedLetters: new Set(),
      selectedPOS: 'noun',
      currentLang: localStorage.getItem('lexora_lang') || 'hi',
      searchQuery: ''
    };

    const POS_CATEGORIES = [
      "noun", "pronoun", "verb", "adjective", "adverb", "preposition", "conjunction", "interjection"
    ];

    // Initialization
    window.addEventListener('DOMContentLoaded', async () => {
      buildAlphabetBar();
      buildPosBar();
      updateLanguageUI();
      setupEventListeners();
      
      // Load initial payload from Cloud Firestore
      await fetchFirestoreData();

      // Dismiss splash after 1.5s
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 500);
      }, 1500);
    });

    async function fetchFirestoreData() {
      try {
        const colRef = collection(db, "vocabularies");
        const snapshot = await getDocs(query(colRef, orderBy("word_lower", "asc")));
        const items = [];
        snapshot.forEach(doc => {
          items.push({ id: doc.id, ...doc.data() });
        });
        window.AppState.rawVocabularies = items;
        applyFiltersAndRender(true);
      } catch (err) {
        console.error("Firestore loading error:", err);
        renderEmptyState("Database offline or syncing. Please check back shortly.");
      }
    }

    function buildAlphabetBar() {
      const container = document.getElementById('alpha-pills-container');
      container.innerHTML = '';
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      chars.forEach(char => {
        const btn = document.createElement('button');
        btn.className = 'alpha-pill';
        btn.textContent = char;
        btn.dataset.letter = char;
        btn.onclick = () => toggleAlphabetFilter(char, btn);
        container.appendChild(btn);
      });
    }

    function buildPosBar() {
      const container = document.getElementById('pos-pills-container');
      container.innerHTML = '';
      POS_CATEGORIES.forEach((pos, idx) => {
        const btn = document.createElement('button');
        btn.className = `pos-pill ${pos === window.AppState.selectedPOS ? 'active' : ''}`;
        btn.textContent = pos;
        btn.onclick = () => selectPOSFilter(pos, btn);
        container.appendChild(btn);
      });
    }

    window.toggleAlphabetFilter = function(letter, element) {
      if (window.AppState.selectedLetters.has(letter)) {
        window.AppState.selectedLetters.delete(letter);
        element.classList.remove('active');
      } else {
        window.AppState.selectedLetters.add(letter);
        element.classList.add('active');
      }
      applyFiltersAndRender(true);
    };

    window.selectPOSFilter = function(pos, element) {
      window.AppState.selectedPOS = pos;
      document.querySelectorAll('.pos-pill').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      applyFiltersAndRender(true);
    };

    window.switchHubMode = function(mode) {
      window.AppState.activeMode = mode;
      document.getElementById('hub-vocab-tab').classList.toggle('active', mode === 'vocab');
      document.getElementById('hub-pos-tab').classList.toggle('active', mode === 'pos');
      
      document.getElementById('vocab-filter-section').style.display = mode === 'vocab' ? 'block' : 'none';
      document.getElementById('pos-filter-section').style.display = mode === 'pos' ? 'block' : 'none';

      applyFiltersAndRender(true);
    };

    function setupEventListeners() {
      const searchInput = document.getElementById('lexora-search-input');
      searchInput.addEventListener('input', (e) => {
        window.AppState.searchQuery = e.target.value.trim().toLowerCase();
        applyFiltersAndRender(true);
      });

      document.getElementById('settings-toggle-btn').addEventListener('click', () => {
        document.getElementById('lang-modal').classList.add('open');
      });
    }

    window.closeLangModal = function() {
      document.getElementById('lang-modal').classList.remove('open');
    };

    window.setLanguage = function(lang) {
      window.AppState.currentLang = lang;
      localStorage.setItem('lexora_lang', lang);
      updateLanguageUI();
      closeLangModal();
      // Re-render feed instantly without reload
      reRenderCurrentBatch();
    };

    function updateLanguageUI() {
      const current = window.AppState.currentLang;
      document.getElementById('lang-btn-hi').classList.toggle('selected', current === 'hi');
      document.getElementById('lang-btn-bn').classList.toggle('selected', current === 'bn');
    }

    window.resetAllFilters = function() {
      window.AppState.selectedLetters.clear();
      window.AppState.searchQuery = '';
      document.getElementById('lexora-search-input').value = '';
      document.querySelectorAll('.alpha-pill').forEach(p => p.classList.remove('active'));
      applyFiltersAndRender(true);
    };

    function applyFiltersAndRender(resetPagination = false) {
      const { rawVocabularies, activeMode, selectedLetters, selectedPOS, searchQuery } = window.AppState;

      let result = rawVocabularies.filter(item => {
        const wordLower = (item.word || '').toLowerCase();
        const firstLetter = (item.first_letter || wordLower.charAt(0) || '').toUpperCase();
        const posLower = (item.pos || '').toLowerCase();
        const meaningHi = (item.meanings?.hi || '').toLowerCase();
        const meaningBn = (item.meanings?.bn || '').toLowerCase();

        // Mode Predicates
        if (activeMode === 'pos' && posLower !== selectedPOS.toLowerCase()) {
          return false;
        }

        if (activeMode === 'vocab' && selectedLetters.size > 0 && !selectedLetters.has(firstLetter)) {
          return false;
        }

        // Search Query Predicate
        if (searchQuery) {
          const matchWord = wordLower.includes(searchQuery);
          const matchMeaning = meaningHi.includes(searchQuery) || meaningBn.includes(searchQuery);
          if (!matchWord && !matchMeaning) return false;
        }

        return true;
      });

      window.AppState.filteredDataset = result;

      // Update Ribbon
      const ribbon = document.getElementById('filter-count-label');
      const resetBtn = document.getElementById('clear-all-filters-btn');
      const hasActiveFilters = selectedLetters.size > 0 || searchQuery.length > 0;
      
      resetBtn.style.display = hasActiveFilters ? 'inline-block' : 'none';
      ribbon.textContent = `${result.length} words found ${activeMode === 'pos' ? `in ${selectedPOS}` : ''}`;

      if (resetPagination) {
        window.AppState.currentBatchIndex = 0;
        document.getElementById('vocab-cards-feed').innerHTML = '';
      }

      loadMoreBatch();
    }

    window.loadMoreBatch = function() {
      const { filteredDataset, currentBatchIndex, batchSize } = window.AppState;
      const feed = document.getElementById('vocab-cards-feed');
      const loadBtn = document.getElementById('load-more-btn');
      const exhaustBanner = document.getElementById('exhaust-state-banner');

      if (filteredDataset.length === 0) {
        renderEmptyState("No vocabulary found matching your query.");
        loadBtn.style.display = 'none';
        exhaustBanner.style.display = 'none';
        return;
      }

      const nextBatch = filteredDataset.slice(currentBatchIndex, currentBatchIndex + batchSize);
      
      nextBatch.forEach(item => {
        feed.appendChild(createVocabCardElement(item));
      });

      window.AppState.currentBatchIndex += nextBatch.length;

      if (window.AppState.currentBatchIndex >= filteredDataset.length) {
        loadBtn.style.display = 'none';
        exhaustBanner.style.display = 'block';
      } else {
        loadBtn.style.display = 'flex';
        exhaustBanner.style.display = 'none';
      }
    };

    function createVocabCardElement(item) {
      const card = document.createElement('article');
      card.className = 'vocab-card';
      card.id = `card-${item.id || item.word}`;

      const currentLang = window.AppState.currentLang;
      const meaning = (item.meanings && item.meanings[currentLang]) ? item.meanings[currentLang] : "N/A";
      const pos = item.pos || "General";
      const example = item.example || "No example sentence provided.";

      card.innerHTML = `
        <div class="vocab-header">
          <div class="vocab-title-wrap">
            <span class="vocab-word">${escapeHTML(item.word)}</span>
            <span class="vocab-pos-badge">${escapeHTML(pos)}</span>
          </div>
          <button class="speaker-btn" title="Pronounce" onclick="pronounceWord('${escapeQuotes(item.word)}', this)">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
        </div>
        <div class="vocab-meaning-box">
          <div class="vocab-meaning-label">${currentLang === 'hi' ? 'Hindi Meaning' : 'Bangla Meaning'}</div>
          <div class="vocab-meaning-text">${escapeHTML(meaning)}</div>
        </div>
        <div class="vocab-example-box">
          <strong>e.g.</strong> ${escapeHTML(example)}
        </div>
      `;
      return card;
    }

    function reRenderCurrentBatch() {
      const feed = document.getElementById('vocab-cards-feed');
      feed.innerHTML = '';
      const { filteredDataset, currentBatchIndex } = window.AppState;
      const itemsToRender = filteredDataset.slice(0, currentBatchIndex);
      itemsToRender.forEach(item => {
        feed.appendChild(createVocabCardElement(item));
      });
    }

    function renderEmptyState(message) {
      const feed = document.getElementById('vocab-cards-feed');
      feed.innerHTML = `
        <div class="empty-state-box">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <p>${escapeHTML(message)}</p>
        </div>
      `;
    }

    // Speech Synthesis
    window.pronounceWord = function(text, btnElement) {
      if (!('speechSynthesis' in window)) {
        alert("Speech synthesis is not supported in this browser.");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      
      if (btnElement) btnElement.classList.add('speaking');
      utterance.onend = () => { if (btnElement) btnElement.classList.remove('speaking'); };
      utterance.onerror = () => { if (btnElement) btnElement.classList.remove('speaking'); };

      window.speechSynthesis.speak(utterance);
    };

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function escapeQuotes(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
