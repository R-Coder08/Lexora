<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexora — Learn Vocabulary & Parts of Speech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #e0e5ec;
      --light-shadow: #ffffff;
      --dark-shadow: #a3b1c6;
      --primary: #4d7cfe;
      --text-main: #2d3748;
      --text-muted: #718096;
      --card-radius: 20px;
      --elevated: 8px 8px 18px var(--dark-shadow), -8px -8px 18px var(--light-shadow);
      --elevated-sm: 4px 4px 10px var(--dark-shadow), -4px -4px 10px var(--light-shadow);
      --inset: inset 5px 5px 10px var(--dark-shadow), inset -5px -5px 10px var(--light-shadow);
      --inset-sm: inset 3px 3px 6px var(--dark-shadow), inset -3px -3px 6px var(--light-shadow);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    #splash {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
    }
    .splash-box {
      width: 100px; height: 100px; border-radius: 26px; background: var(--bg);
      box-shadow: var(--elevated); display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; animation: pPulse 1.5s infinite ease-in-out;
    }
    @keyframes pPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    header {
      width: 100%; max-width: 860px; padding: 20px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }

    .neo-icon-btn {
      width: 44px; height: 44px; border-radius: 12px; border: none; background: var(--bg);
      box-shadow: var(--elevated-sm); display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-main);
    }
    .neo-icon-btn:active { box-shadow: var(--inset-sm); }

    main { width: 100%; max-width: 860px; padding: 10px 20px 60px; display: flex; flex-direction: column; gap: 20px; }

    /* Modules */
    .module-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .module-btn {
      padding: 16px; border-radius: var(--card-radius); background: var(--bg);
      box-shadow: var(--elevated); border: none; cursor: pointer; text-align: left;
      transition: all 0.2s ease;
    }
    .module-btn.active { box-shadow: var(--inset); color: var(--primary); }
    .module-btn h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .module-btn p { font-size: 12px; color: var(--text-muted); }

    /* Filters */
    .search-box {
      width: 100%; height: 50px; border-radius: 50px; background: var(--bg);
      box-shadow: var(--inset); display: flex; align-items: center; padding: 0 20px; gap: 10px;
    }
    .search-box input {
      width: 100%; border: none; background: transparent; outline: none; font-size: 15px; font-weight: 600;
    }

    .scroll-row { width: 100%; overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: none; }
    .scroll-row::-webkit-scrollbar { display: none; }
    .pills-holder { display: flex; gap: 8px; width: max-content; }

    .filter-pill {
      min-width: 38px; height: 38px; padding: 0 14px; border-radius: 12px; border: none;
      background: var(--bg); box-shadow: var(--elevated-sm); font-weight: 700; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      text-transform: capitalize;
    }
    .filter-pill.active { box-shadow: var(--inset-sm); color: var(--primary); background: #d3dbe6; font-weight: 800; }

    .feed-list { display: flex; flex-direction: column; gap: 16px; }
    .vocab-card {
      background: var(--bg); border-radius: var(--card-radius); box-shadow: var(--elevated);
      padding: 20px; display: flex; flex-direction: column; gap: 10px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .word-text { font-size: 20px; font-weight: 800; }
    .pos-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; box-shadow: var(--inset-sm); color: var(--primary); }

    .speak-btn {
      width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--bg);
      box-shadow: var(--elevated-sm); color: var(--primary); display: flex; align-items: center;
      justify-content: center; cursor: pointer;
    }
    .speak-btn:active { box-shadow: var(--inset-sm); }

    .meaning-box {
      background: rgba(255,255,255,0.4); padding: 10px 14px; border-radius: 10px;
      border-left: 3px solid var(--primary); font-size: 15px; font-weight: 600;
      font-family: 'Noto Sans Devanagari', 'Hind Siliguri', sans-serif;
    }
    .example-box { font-size: 13px; color: #4a5568; font-style: italic; }

    .neo-load-btn {
      width: 100%; padding: 15px; border-radius: 50px; border: none; background: var(--bg);
      box-shadow: var(--elevated); color: var(--primary); font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .neo-load-btn:active { box-shadow: var(--inset); }

    /* Language Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(163,177,198,0.5); backdrop-filter: blur(4px);
      z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; visibility: hidden; transition: all 0.2s ease;
    }
    .modal-backdrop.open { opacity: 1; visibility: visible; }
    .modal-content {
      width: 100%; max-width: 380px; background: var(--bg); border-radius: 20px;
      box-shadow: 12px 12px 24px var(--dark-shadow), -12px -12px 24px var(--light-shadow);
      padding: 22px; display: flex; flex-direction: column; gap: 16px;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-box">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="var(--primary)"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <h2 style="font-weight: 800; letter-spacing: 1px;">LEXORA</h2>
    <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Vocabulary &amp; Parts of Speech</p>
  </div>

  <header>
    <div class="brand-title">Lexora</div>
    <button class="neo-icon-btn" onclick="openLangModal()" title="Change Language">
      <span id="lang-code-indicator" style="font-size: 12px; font-weight: 800; color: var(--primary);">HI</span>
    </button>
  </header>

  <main>
    <!-- Section Switcher -->
    <div class="module-nav">
      <button class="module-btn active" id="btn-mod-vocab" onclick="setSectionMode('vocab')">
        <h3>1. English Vocabulary</h3>
        <p>A to Z Letters (Multi-filter A, F, G...)</p>
      </button>
      <button class="module-btn" id="btn-mod-pos" onclick="setSectionMode('pos')">
        <h3>2. Parts of Speech</h3>
        <p>Isolated Noun, Verb, Adjective etc.</p>
      </button>
    </div>

    <!-- Search Box -->
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-muted)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="live-search-input" placeholder="Search word or regional meaning..." oninput="handleSearch(this.value)" />
    </div>

    <!-- Vocabulary Mode: Multi-Letter Selector -->
    <div id="vocab-filter-wrap" class="scroll-row">
      <div class="pills-holder" id="alpha-pills-bar"></div>
    </div>

    <!-- POS Mode: 8 Dedicated Categories Selector -->
    <div id="pos-filter-wrap" class="scroll-row" style="display: none;">
      <div class="pills-holder" id="pos-pills-bar"></div>
    </div>

    <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between;">
      <span id="status-record-count">Loading data...</span>
      <span id="active-filter-details"></span>
    </div>

    <!-- Feed -->
    <div class="feed-list" id="feed-container"></div>

    <button class="neo-load-btn" id="btn-load-more" onclick="renderNextBatch()" style="display: none;">
      Load More Words
    </button>
    <div id="exhaust-msg" style="display: none; text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted); padding: 14px;">
      ✨ More Vocabularies are coming.
    </div>
  </main>

  <!-- Language Selection Modal -->
  <div class="modal-backdrop" id="lang-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 16px; font-weight: 800;">Select Meaning Language</h3>
        <button class="neo-icon-btn" style="width: 32px; height: 32px;" onclick="closeLangModal()">✕</button>
      </div>
      <button class="filter-pill" style="width: 100%; height: 46px;" onclick="changeLanguage('hi')">Hindi (हिन्दी)</button>
      <button class="filter-pill" style="width: 100%; height: 46px;" onclick="changeLanguage('bn')">Bangla (বাংলা)</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDr9WJjxT2ukf9-rVqDbwPSyyS5ePQeiGc",
      authDomain: "lexora-web.firebaseapp.com",
      databaseURL: "https://lexora-web-default-rtdb.firebaseio.com",
      projectId: "lexora-web",
      storageBucket: "lexora-web.firebasestorage.app",
      messagingSenderId: "1024514893435",
      appId: "1:1024514893435:web:7f60901be0e63ce4cb24de"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const POS_LIST = ["noun", "pronoun", "verb", "adjective", "adverb", "preposition", "conjunction", "interjection"];

    window.ClientState = {
      section: 'vocab', // 'vocab' | 'pos'
      selectedLetters: new Set(), // Multi-letter filter: A, F, G...
      selectedPOS: 'noun', // Isolated single POS selection
      searchQuery: '',
      currentLang: localStorage.getItem('lexora_lang') || 'hi',
      vocabDataset: [],
      posDataset: {}, // Cache per POS bucket { noun: [], adjective: [] }
      filteredList: [],
      currentIndex: 0,
      batchSize: 20
    };

    window.addEventListener('DOMContentLoaded', async () => {
      buildAlphaPills();
      buildPosPills();
      updateLangBadge();

      // Initial Fetch
      await loadVocabData();

      setTimeout(() => {
        const s = document.getElementById('splash');
        s.style.opacity = '0';
        setTimeout(() => s.style.display = 'none', 400);
      }, 1500);
    });

    async function loadVocabData() {
      document.getElementById('status-record-count').textContent = "Fetching Vocabulary...";
      try {
        const snap = await getDocs(query(collection(db, "vocabularies"), orderBy("word_lower", "asc")));
        const items = [];
        snap.forEach(d => items.push(d.data()));
        window.ClientState.vocabDataset = items;
        applyCurrentFilters();
      } catch (e) {
        document.getElementById('feed-container').innerHTML = `<p style="text-align:center; color:var(--text-muted);">Database sync issue: ${e.message}</p>`;
      }
    }

    async function loadPosCategoryData(cat) {
      if (window.ClientState.posDataset[cat]) {
        applyCurrentFilters();
        return;
      }
      document.getElementById('status-record-count').textContent = `Fetching isolated ${cat}s...`;
      try {
        const snap = await getDocs(query(collection(db, `pos_${cat}`), orderBy("word_lower", "asc")));
        const items = [];
        snap.forEach(d => items.push(d.data()));
        window.ClientState.posDataset[cat] = items;
        applyCurrentFilters();
      } catch (e) {
        console.error(e);
      }
    }

    function buildAlphaPills() {
      const container = document.getElementById('alpha-pills-bar');
      container.innerHTML = '';
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
        const b = document.createElement('button');
        b.className = 'filter-pill';
        b.textContent = letter;
        b.onclick = () => {
          if (window.ClientState.selectedLetters.has(letter)) {
            window.ClientState.selectedLetters.delete(letter);
            b.classList.remove('active');
          } else {
            window.ClientState.selectedLetters.add(letter);
            b.classList.add('active');
          }
          applyCurrentFilters();
        };
        container.appendChild(b);
      });
    }

    function buildPosPills() {
      const container = document.getElementById('pos-pills-bar');
      container.innerHTML = '';
      POS_LIST.forEach(cat => {
        const b = document.createElement('button');
        b.className = `filter-pill ${cat === window.ClientState.selectedPOS ? 'active' : ''}`;
        b.textContent = cat;
        b.onclick = () => {
          document.querySelectorAll('#pos-pills-bar .filter-pill').forEach(el => el.classList.remove('active'));
          b.classList.add('active');
          window.ClientState.selectedPOS = cat;
          loadPosCategoryData(cat);
        };
        container.appendChild(b);
      });
    }

    window.setSectionMode = function(mode) {
      window.ClientState.section = mode;
      document.getElementById('btn-mod-vocab').classList.toggle('active', mode === 'vocab');
      document.getElementById('btn-mod-pos').classList.toggle('active', mode === 'pos');
      document.getElementById('vocab-filter-wrap').style.display = mode === 'vocab' ? 'block' : 'none';
      document.getElementById('pos-filter-wrap').style.display = mode === 'pos' ? 'block' : 'none';

      if (mode === 'vocab') {
        applyCurrentFilters();
      } else {
        loadPosCategoryData(window.ClientState.selectedPOS);
      }
    };

    window.handleSearch = function(val) {
      window.ClientState.searchQuery = val.trim().toLowerCase();
      applyCurrentFilters();
    };

    function applyCurrentFilters() {
      const { section, vocabDataset, posDataset, selectedPOS, selectedLetters, searchQuery } = window.ClientState;
      let pool = section === 'vocab' ? vocabDataset : (posDataset[selectedPOS] || []);

      let result = pool.filter(item => {
        const w = (item.word || '').toLowerCase();
        const first = (item.first_letter || w.charAt(0) || '').toUpperCase();
        const hi = (item.meanings?.hi || '').toLowerCase();
        const bn = (item.meanings?.bn || '').toLowerCase();

        if (section === 'vocab' && selectedLetters.size > 0 && !selectedLetters.has(first)) {
          return false;
        }

        if (searchQuery) {
          if (!w.includes(searchQuery) && !hi.includes(searchQuery) && !bn.includes(searchQuery)) return false;
        }
        return true;
      });

      window.ClientState.filteredList = result;
      window.ClientState.currentIndex = 0;
      document.getElementById('feed-container').innerHTML = '';

      // Count label
      document.getElementById('status-record-count').textContent = `${result.length} words found`;
      document.getElementById('active-filter-details').textContent = 
        section === 'vocab' 
          ? (selectedLetters.size > 0 ? `Letters: [${Array.from(selectedLetters).join(', ')}]` : 'All A-Z')
          : `Category: ${selectedPOS.toUpperCase()}`;

      renderNextBatch();
    }

    window.renderNextBatch = function() {
      const { filteredList, currentIndex, batchSize, currentLang } = window.ClientState;
      const feed = document.getElementById('feed-container');
      const next = filteredList.slice(currentIndex, currentIndex + batchSize);

      next.forEach(item => {
        const c = document.createElement('div');
        c.className = 'vocab-card';
        const m = item.meanings?.[currentLang] || 'N/A';
        c.innerHTML = `
          <div class="card-top">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="word-text">${escapeHTML(item.word)}</span>
              <span class="pos-tag">${escapeHTML(item.pos || 'General')}</span>
            </div>
            <button class="speak-btn" onclick="speakText('${escapeQuotes(item.word)}')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
          </div>
          <div class="meaning-box">${escapeHTML(m)}</div>
          <div class="example-box"><strong>e.g.</strong> ${escapeHTML(item.example || 'No example sentence.')}</div>
        `;
        feed.appendChild(c);
      });

      window.ClientState.currentIndex += next.length;

      const hasMore = window.ClientState.currentIndex < filteredList.length;
      document.getElementById('btn-load-more').style.display = hasMore ? 'block' : 'none';
      document.getElementById('exhaust-msg').style.display = (filteredList.length > 0 && !hasMore) ? 'block' : 'none';

      if (filteredList.length === 0) {
        feed.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted);">No vocabulary records match this filter.</div>`;
      }
    };

    window.speakText = function(txt) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    };

    window.openLangModal = () => document.getElementById('lang-modal').classList.add('open');
    window.closeLangModal = () => document.getElementById('lang-modal').classList.remove('open');
    window.changeLanguage = function(lang) {
      window.ClientState.currentLang = lang;
      localStorage.setItem('lexora_lang', lang);
      updateLangBadge();
      closeLangModal();
      applyCurrentFilters();
    };
    function updateLangBadge() {
      document.getElementById('lang-code-indicator').textContent = window.ClientState.currentLang.toUpperCase();
    }

    function escapeHTML(s) { return String(s || '').replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t])); }
    function escapeQuotes(s) { return String(s || '').replace(/'/g, "\\'"); }
  </script>
</body>
</html>
